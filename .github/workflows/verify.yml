name: Glint verification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/mac/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install cargo-audit 0.22.2
        run: |
          if ! cargo audit --version 2>/dev/null | grep -q '0\.22\.2'; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Python dependencies
        run: uv sync --locked --extra test --no-install-project
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Phase 1
        run: make verify-phase1 PYTHON_BIN=.venv/bin/python
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-acceptance-artifacts
          path: tests/artifacts/**
          if-no-files-found: warn

  phase2:
    runs-on: ubuntu-latest
    needs: phase1
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/mac/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install cargo-audit 0.22.2
        run: |
          if ! cargo audit --version 2>/dev/null | grep -q '0\.22\.2'; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Python dependencies
        run: uv sync --locked --extra test --no-install-project
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Phase 2 without live network calls
        run: make verify-phase2 PYTHON_BIN=.venv/bin/python
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-acceptance-artifacts
          path: tests/artifacts/**
          if-no-files-found: warn

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/mac/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install cargo-audit 0.22.2
        run: |
          if ! cargo audit --version 2>/dev/null | grep -q '0\.22\.2'; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Python dependencies
        run: uv sync --locked --extra test --no-install-project
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run dependency security audit
        run: make audit PYTHON_BIN=.venv/bin/python

  macos-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native verification tools
        run: brew install ripgrep
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python dependencies
        run: uv sync --locked --extra test --no-install-project
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/mac/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/mac/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify native Tauri runtime
        run: ./scripts/verify_tauri_runtime.sh
      - name: Package Glint.app artifact
        run: ditto -c -k --sequesterRsrc --keepParent apps/mac/src-tauri/target/debug/bundle/macos/Glint.app "$RUNNER_TEMP/Glint.app.zip"
      - name: Upload Glint.app bundle
        uses: actions/upload-artifact@v4
        with:
          name: glint-macos-app-${{ github.sha }}
          path: ${{ runner.temp }}/Glint.app.zip
          if-no-files-found: error
