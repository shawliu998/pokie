name: Glint verification

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  phase1:
    runs-on: ubuntu-latest
    env:
      GLINT_E2E_API_MODE: external
      GLINT_AUTH_PRINCIPAL_ID: 22222222-2222-5222-8222-222222222222
      GLINT_AUTH_WORKSPACE_ID: 11111111-1111-5111-8111-111111111111
      GLINT_AUTH_AUDIENCE: glint-api
      GLINT_AUTH_ISSUER: glint-acceptance
      VITE_GLINT_WORKSPACE_ID: 11111111-1111-5111-8111-111111111111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --version 0.22.2 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Python dependencies
        run: uv sync --locked --extra test --no-install-project
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Phase 1
        run: make verify-phase1 PYTHON_BIN=.venv/bin/python
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-acceptance-artifacts
          path: tests/artifacts/**
          if-no-files-found: warn

  phase2:
    runs-on: ubuntu-latest
    needs: phase1
    env:
      GLINT_E2E_API_MODE: external
      GLINT_AUTH_PRINCIPAL_ID: 22222222-2222-5222-8222-222222222222
      GLINT_AUTH_WORKSPACE_ID: 11111111-1111-5111-8111-111111111111
      GLINT_AUTH_AUDIENCE: glint-api
      GLINT_AUTH_ISSUER: glint-acceptance
      VITE_GLINT_WORKSPACE_ID: 11111111-1111-5111-8111-111111111111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --version 0.22.2 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Python dependencies
        run: uv sync --locked --extra test --no-install-project
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Phase 2 without live network calls
        run: make verify-phase2 PYTHON_BIN=.venv/bin/python
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-acceptance-artifacts
          path: tests/artifacts/**
          if-no-files-found: warn

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --version 0.22.2 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Python dependencies
        run: uv sync --locked --extra test --no-install-project
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run dependency security audit
        run: make audit PYTHON_BIN=.venv/bin/python

  macos-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
      - name: Install Python dependencies
        run: uv sync --locked --extra test --no-install-project
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify native Tauri runtime
        run: ./scripts/verify_tauri_runtime.sh
