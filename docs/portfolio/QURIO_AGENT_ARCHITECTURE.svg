<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Qurio Research Agent architecture</title>
  <desc id="desc">One bounded Research Agent uses registered tools and a deterministic evaluator, retains structured evidence, and opens a sealed holdout only after training selection.</desc>
  <rect width="1600" height="900" fill="#0f1115"/>
  <style>
    .eyebrow{font:600 16px Inter,ui-sans-serif,system-ui;letter-spacing:2px;fill:#8b93a7}
    .title{font:650 42px Inter,ui-sans-serif,system-ui;fill:#f4f6fb}
    .subtitle{font:400 19px Inter,ui-sans-serif,system-ui;fill:#aeb5c5}
    .section{font:600 14px Inter,ui-sans-serif,system-ui;letter-spacing:1.5px;fill:#7f87a0}
    .label{font:600 20px Inter,ui-sans-serif,system-ui;fill:#f2f4f8}
    .body{font:400 15px Inter,ui-sans-serif,system-ui;fill:#aeb5c5}
    .small{font:500 13px Inter,ui-sans-serif,system-ui;fill:#81899c}
    .accent{fill:#8d92ff}
    .node{fill:#171a21;stroke:#313746;stroke-width:1.5}
    .node2{fill:#1b1e27;stroke:#4e5680;stroke-width:1.5}
    .line{stroke:#50586e;stroke-width:2;fill:none}
    .dash{stroke:#50586e;stroke-width:2;fill:none;stroke-dasharray:7 8}
  </style>

  <text x="72" y="70" class="eyebrow">QURIO / RESEARCH RUNTIME</text>
  <text x="72" y="124" class="title">One Agent. Bounded actions. Verifiable evidence.</text>
  <text x="72" y="160" class="subtitle">The model decides what to try; the quantitative kernel decides what happened.</text>

  <text x="72" y="225" class="section">RESEARCH CONTRACT</text>
  <rect x="72" y="246" width="380" height="176" rx="6" class="node"/>
  <text x="98" y="283" class="label">Pinned inputs</text>
  <text x="98" y="318" class="body">Retained market dataset + digest</text>
  <text x="98" y="348" class="body">Bounded objective + supported scope</text>
  <text x="98" y="378" class="body">Approved plan + action budget</text>
  <text x="98" y="404" class="small">Provider and runtime identity are fixed for the Run</text>

  <path d="M452 334 H520" class="line"/>
  <path d="M509 326 L520 334 L509 342" class="line"/>

  <text x="520" y="225" class="section">AUTONOMOUS RESEARCH LOOP</text>
  <rect x="520" y="246" width="560" height="392" rx="6" class="node2"/>
  <circle cx="560" cy="286" r="5" class="accent"/>
  <text x="578" y="293" class="label">Research Agent</text>
  <text x="550" y="330" class="body">Chooses one legal next action from the approved plan and retained observations.</text>

  <rect x="550" y="364" width="228" height="108" rx="4" class="node"/>
  <text x="570" y="397" class="label">Registered tool</text>
  <text x="570" y="426" class="body">7 typed research actions</text>
  <text x="570" y="452" class="small">No arbitrary Python or Broker</text>

  <path d="M778 418 H822" class="line"/>
  <path d="M811 410 L822 418 L811 426" class="line"/>

  <rect x="822" y="364" width="228" height="108" rx="4" class="node"/>
  <text x="842" y="397" class="label">Evaluator</text>
  <text x="842" y="426" class="body">Metrics, trades, comparison</text>
  <text x="842" y="452" class="small">One authoritative kernel</text>

  <path d="M936 472 V520 H664 V472" class="line"/>
  <path d="M656 483 L664 472 L672 483" class="line"/>
  <text x="690" y="511" class="small">structured observation feeds the next decision</text>

  <line x1="550" y1="552" x2="1050" y2="552" stroke="#313746"/>
  <text x="550" y="584" class="section">VISIBLE PRODUCT NARRATIVE</text>
  <text x="550" y="614" class="body">Observation</text>
  <text x="685" y="614" class="accent" style="font:600 18px Inter,ui-sans-serif,system-ui">→</text>
  <text x="724" y="614" class="body">Why Qurio changed</text>
  <text x="897" y="614" class="accent" style="font:600 18px Inter,ui-sans-serif,system-ui">→</text>
  <text x="936" y="614" class="body">Next action</text>

  <path d="M1080 334 H1148" class="line"/>
  <path d="M1137 326 L1148 334 L1137 342" class="line"/>

  <text x="1148" y="225" class="section">RETAINED OUTPUT</text>
  <rect x="1148" y="246" width="380" height="176" rx="6" class="node"/>
  <text x="1174" y="283" class="label">Structured Research Memory</text>
  <text x="1174" y="318" class="body">Candidates + canonical identity</text>
  <text x="1174" y="348" class="body">Observations + experiment evidence</text>
  <text x="1174" y="378" class="body">Versions, attempts + final report</text>
  <text x="1174" y="404" class="small">Re-openable evidence, not a chat transcript</text>

  <path d="M1338 422 V486" class="dash"/>
  <path d="M1330 475 L1338 486 L1346 475" class="line"/>
  <rect x="1148" y="486" width="380" height="152" rx="6" class="node"/>
  <text x="1174" y="523" class="label">Sealed holdout</text>
  <text x="1174" y="556" class="body">Opened once, after training selection</text>
  <text x="1174" y="586" class="body">Produces pass or fail—never another tune</text>
  <text x="1174" y="616" class="small">Isolated across the Research Series</text>

  <rect x="72" y="704" width="1456" height="120" rx="6" class="node"/>
  <text x="98" y="742" class="section">GOLDEN PROOF / 22 JUL 2026</text>
  <text x="98" y="783" class="label">Binance BTCUSDT · 4h</text>
  <text x="370" y="783" class="body">1,000 closed bars · 0 gaps</text>
  <line x1="620" y1="750" x2="620" y2="800" stroke="#313746"/>
  <text x="654" y="783" class="label">DeepSeek deepseek-chat</text>
  <text x="910" y="783" class="body">Mock fallback off</text>
  <line x1="1075" y1="750" x2="1075" y2="800" stroke="#313746"/>
  <text x="1108" y="783" class="label">3 candidates</text>
  <text x="1260" y="783" class="body">RSI selected · holdout pass</text>
  <text x="98" y="850" class="small">Product-loop verification, not a profitability claim.</text>
</svg>
