services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: glint
      POSTGRES_USER: glint_owner
      POSTGRES_PASSWORD: glint_owner_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - glint_postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glint_owner -d glint"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: glint_minio_root
      MINIO_ROOT_PASSWORD: glint_minio_root_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - glint_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::glint-objects/workspaces/*/imports/*","arn:aws:s3:::glint-objects/quarantine/workspaces/*/imports/*","arn:aws:s3:::glint-objects/workspaces/*/collections/*","arn:aws:s3:::glint-objects/workspaces/*/brief-exports/*","arn:aws:s3:::glint-objects/compose-smoke/*"]}]}'
        > /tmp/glint-app-policy.json &&
        mc alias set local http://minio:9000 glint_minio_root glint_minio_root_password &&
        mc mb --ignore-existing local/glint-objects &&
        (mc admin policy create local glint-app-object-rw-v2 /tmp/glint-app-policy.json || mc admin policy info local glint-app-object-rw-v2 >/dev/null) &&
        (mc admin user add local glint_app_minio glint_app_minio_password || true) &&
        (mc admin policy detach local glint-app-rw --user glint_app_minio || true) &&
        mc admin policy attach local glint-app-object-rw-v2 --user glint_app_minio

  api:
    build:
      context: ..
      dockerfile: infra/docker/python-app/Dockerfile
    image: glint-python-app:local
    working_dir: /workspace
    command:
      - /bin/sh
      - -c
      - >
        /usr/bin/env GLINT_DATABASE_URL=postgresql+psycopg://glint_owner:glint_owner_dev_password@postgres:5432/glint
        /opt/glint-venv/bin/alembic -c infra/migrations/alembic.ini upgrade head &&
        /opt/glint-venv/bin/uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      GLINT_ENVIRONMENT: production
      GLINT_SERVICE_ROLE: api
      GLINT_CREATE_SCHEMA_ON_STARTUP: "false"
      GLINT_DATABASE_URL: postgresql+psycopg://glint_api:glint_api_dev_password@postgres:5432/glint
      GLINT_REDIS_URL: redis://redis:6379/0
      GLINT_OBJECT_STORE_BACKEND: s3
      GLINT_S3_ENDPOINT_URL: http://minio:9000
      GLINT_S3_BUCKET: glint-objects
      GLINT_S3_ACCESS_KEY_ID: glint_app_minio
      GLINT_S3_SECRET_ACCESS_KEY: glint_app_minio_password
      GLINT_OBJECT_STORE_ROOT: /workspace/.glint-objects
      GLINT_AUTH_HMAC_SECRET: ${GLINT_AUTH_HMAC_SECRET:?set GLINT_AUTH_HMAC_SECRET}
      GLINT_AUTH_ISSUER: ${GLINT_AUTH_ISSUER:?set GLINT_AUTH_ISSUER}
      GLINT_AUTH_AUDIENCE: ${GLINT_AUTH_AUDIENCE:?set GLINT_AUTH_AUDIENCE}
      GLINT_ALLOWED_ORIGINS: '["http://127.0.0.1:1420","http://localhost:3000"]'
      GLINT_MODEL_RUNTIME_ENABLED: ${GLINT_MODEL_RUNTIME_ENABLED:-false}
      GLINT_DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ..:/workspace

  worker:
    image: glint-python-app:local
    working_dir: /workspace
    command: ["/opt/glint-venv/bin/python", "-m", "services.worker.app.main", "poll"]
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      GLINT_WORKER_MODE: production
      GLINT_WORKER_ID: glint-worker-1
      GLINT_ENVIRONMENT: production
      GLINT_SERVICE_ROLE: worker
      GLINT_CREATE_SCHEMA_ON_STARTUP: "false"
      GLINT_DATABASE_URL: postgresql+psycopg://glint_worker:glint_worker_dev_password@postgres:5432/glint
      GLINT_WORKSPACE_ID: ${GLINT_WORKSPACE_ID:?set GLINT_WORKSPACE_ID}
      GLINT_REDIS_URL: redis://redis:6379/0
      GLINT_OBJECT_STORE_BACKEND: s3
      GLINT_S3_ENDPOINT_URL: http://minio:9000
      GLINT_S3_BUCKET: glint-objects
      GLINT_S3_ACCESS_KEY_ID: glint_app_minio
      GLINT_S3_SECRET_ACCESS_KEY: glint_app_minio_password
      GLINT_API_OBJECT_STORE: services.api.app.core.object_store:get_object_store
      GLINT_CONNECTOR_FACTORY: connectors.factory:create_connector_factory
      GLINT_CONNECTOR_CURSOR_SECRET: ${GLINT_CONNECTOR_CURSOR_SECRET:?set GLINT_CONNECTOR_CURSOR_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    healthcheck:
      test: ["CMD-SHELL", "/opt/glint-venv/bin/python -m services.worker.app.main health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ..:/workspace

  smoke:
    image: glint-python-app:local
    working_dir: /workspace
    command: ["/bin/sh", "infra/scripts/compose-smoke.sh"]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      GLINT_WORKER_MODE: production
      GLINT_WORKER_ID: glint-smoke-worker
      GLINT_ENVIRONMENT: production
      GLINT_SERVICE_ROLE: worker
      GLINT_CREATE_SCHEMA_ON_STARTUP: "false"
      GLINT_DATABASE_URL: postgresql+psycopg://glint_worker:glint_worker_dev_password@postgres:5432/glint
      GLINT_API_DATABASE_URL: postgresql://glint_api:glint_api_dev_password@postgres:5432/glint
      GLINT_WORKER_DATABASE_URL: postgresql://glint_worker:glint_worker_dev_password@postgres:5432/glint
      GLINT_WORKSPACE_ID: ${GLINT_WORKSPACE_ID:?set GLINT_WORKSPACE_ID}
      GLINT_REDIS_URL: redis://redis:6379/0
      GLINT_OBJECT_STORE_BACKEND: s3
      GLINT_S3_ENDPOINT_URL: http://minio:9000
      GLINT_S3_BUCKET: glint-objects
      GLINT_S3_ACCESS_KEY_ID: glint_app_minio
      GLINT_S3_SECRET_ACCESS_KEY: glint_app_minio_password
      GLINT_API_OBJECT_STORE: services.api.app.core.object_store:get_object_store
      GLINT_CONNECTOR_FACTORY: connectors.factory:create_connector_factory
      GLINT_CONNECTOR_CURSOR_SECRET: ${GLINT_CONNECTOR_CURSOR_SECRET:?set GLINT_CONNECTOR_CURSOR_SECRET}
    volumes:
      - ..:/workspace

volumes:
  glint_postgres:
  glint_minio:
