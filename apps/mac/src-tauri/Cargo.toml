[package]
name = "glint"
version = "0.1.0"
description = "Glint Phase 1 Mac shell"
authors = ["Glint"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.1", features = [] }
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
